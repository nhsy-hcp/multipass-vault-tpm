---
version: '3'

# Optional host overrides (see .env.template). Missing file is fine.
dotenv: ['.env']

vars:
  # VM. Every value here can be overridden by the same name in .env; see
  # .env.template.
  NAME: '{{.VM_NAME | default "tpm-lab"}}'
  UBUNTU: "24.04"
  CPUS: "2"
  MEMORY: 4G
  DISK: 20G

  # Lab identity
  DEVICE_NAME: '{{.DEVICE_NAME | default "node01"}}'
  DOMAIN: '{{.DOMAIN | default "devices.lab.local"}}'

  # Two software TPMs run in the VM: the device TPM, and a second one standing
  # in for a different machine during the Part 8 demos. Each serves a unix
  # socket inside its state directory; see scripts/lib/common.sh for the paths.
  VM_DIR: /home/ubuntu/lab

  # Host-side scratch. Everything transient this project writes on the Mac goes
  # here, never /tmp — it is gitignored and removed by `task clean:tmp`.
  TMP_DIR: .tmp

  # In-VM staging for transferred scripts. The guest's own /tmp is the right
  # place for this — the host's .tmp/ convention keeps the Mac clean and does
  # not extend into a throwaway VM. Namespaced rather than bare /tmp so the
  # lab's files cannot collide with anything else in the guest.
  VM_STAGE: /tmp/tpm-lab

  # Vault Enterprise. The VM installs this vault-enterprise package version
  # from the HashiCorp apt repository and holds it there. The licence is the
  # one thing that comes from the host: its text, as VAULT_LICENSE in .env.
  # It is deliberately not a Task var — Task echoes commands, so the licence
  # must never pass through a template. Scripts read it from the environment.
  VAULT_VERSION: '{{.VAULT_VERSION | default "2.2.0+ent-1"}}'

tasks:
  default:
    cmd: task --list

  # ==========================================================================
  # Host
  # ==========================================================================
  deps:
    desc: Check host dependencies (multipass, task, jq, graphviz) and the Vault Enterprise licence
    cmd: ./scripts/host/deps.sh

  init:
    desc: One-time project setup — install pre-commit hooks
    cmds:
      - mkdir -p {{.TMP_DIR}}
      - pre-commit install
      - cmd: test -f .env || cp .env.template .env
        ignore_error: true
      - echo "Project initialised. Next- task deps, then task all"
    silent: true

  clean:tmp:
    desc: Remove host-side scratch files
    cmd: rm -rf {{.TMP_DIR}}

  # ==========================================================================
  # VM lifecycle
  # ==========================================================================
  launch:
    desc: Launch the Multipass VM (no-op if it already exists)
    # Fail fast on a missing host tool rather than deep inside a provisioning
    # script. `all` reaches the VM only through here, so one gate covers both.
    deps: [deps]
    status:
      - multipass info {{.NAME}} >/dev/null 2>&1
    cmds:
      - echo "Launching {{.NAME}} — Ubuntu {{.UBUNTU}}, {{.CPUS}} cpus, {{.MEMORY}} memory, {{.DISK}} disk"
      - multipass launch {{.UBUNTU}} --name {{.NAME}} --cpus {{.CPUS}} --memory {{.MEMORY}} --disk {{.DISK}}
      - multipass info {{.NAME}}

  start:
    aliases: [up]
    desc: Start a stopped VM
    cmd: multipass start {{.NAME}}

  stop:
    aliases: [down]
    desc: Stop the VM, keeping all lab state on disk
    cmd: multipass stop {{.NAME}}

  shell:
    desc: Open an interactive shell in the VM
    cmd: multipass shell {{.NAME}}

  clean:
    desc: Delete and purge the VM entirely
    cmds:
      - multipass stop {{.NAME}}
      - multipass delete --purge {{.NAME}}
    ignore_error: true

  rebuild:
    desc: Destroy everything and rebuild the lab from scratch
    cmds:
      - task: clean
      - task: all

  # ==========================================================================
  # Logs
  # ==========================================================================
  logs:tpm:
    desc: Follow the device swtpm journal
    cmd: multipass exec {{.NAME}} -- sudo journalctl -u swtpm@device -f

  logs:vault:
    desc: Follow the Vault dev server journal
    cmd: multipass exec {{.NAME}} -- sudo journalctl -u vault-dev -f

  logs:agent:
    desc: Follow the Vault Agent journal (Part 9)
    cmd: multipass exec {{.NAME}} -- sudo journalctl -u vault-agent -f

  logs:proxy:
    desc: Follow the Vault Agent proxy journals (Parts 10-11)
    cmd: multipass exec {{.NAME}} -- sudo journalctl -u vault-proxy-single -u 'vault-proxy@*' -f

  logs:
    desc: Show recent logs from all lab services
    cmds:
      - multipass exec {{.NAME}} -- sudo journalctl -u swtpm@device -u swtpm@attacker -u vault-dev -u vault-agent -u vault-proxy-single -u 'vault-proxy@*' --no-pager -n 50

  # ==========================================================================
  # Lab build — each step is idempotent and individually re-runnable
  # ==========================================================================
  all:
    desc: Build the whole lab (provision, tpm, vault, config, enrol)
    cmds:
      - task: launch
      - task: provision
      - task: tpm
      - task: vault
      - task: config
      - task: enrol
      - echo ""
      - echo "Lab ready. Run 'task demo' for the full walkthrough."

  demo:prepare:
    aliases: [provision-demo]
    desc: Build the VM, TPMs and Vault, and stop before configuration — for a live demo of Parts 4-6
    cmds:
      - task: launch
      - task: provision
      - task: tpm
      - task: vault
      - echo ""
      - echo "Infrastructure ready. Configure and enrol by hand from Part 4, or run 'task config enrol'."

  provision:
    desc: 'Part 1: install TPM tooling and Vault Enterprise in the VM'
    preconditions:
      - sh: test -n "${VAULT_LICENSE:-}"
        msg: "VAULT_LICENSE is empty — paste your Vault Enterprise licence text into .env (see .env.template)"
    cmds:
      # The licence is pushed here, not in _sync: it changes rarely and lives
      # outside the repo, so it must not ride along on every step.
      - ./scripts/host/push_licence.sh {{.NAME}} {{.VM_STAGE}}
      - task: _run
        vars: {SCRIPT: 00_provision.sh, ARGS: '{{.VAULT_VERSION}}'}

  tpm:
    desc: 'Part 2: start the software TPMs as systemd units'
    cmds:
      - task: _run
        vars: {SCRIPT: 10_tpm_unit.sh}

  vault:
    desc: 'Part 3: start the Vault dev server (TLS) as a systemd unit'
    cmds:
      - task: _run
        vars: {SCRIPT: 20_vault_unit.sh}

  config:
    desc: 'Parts 4-5: tpm auth method and its CA, KV secret, policy, device group and role, orchestrator token'
    cmds:
      - task: _run
        vars: {SCRIPT: 30_vault_config.sh, ARGS: '{{.DOMAIN}} {{.DEVICE_NAME}}'}

  enrol:
    desc: 'Part 6: register the device TPM with Vault and attest it for a certificate'
    cmds:
      - task: _run
        vars: {SCRIPT: 40_enrol_device.sh, ARGS: '{{.DEVICE_NAME}} {{.DOMAIN}}'}

  # ==========================================================================
  # Demo
  # ==========================================================================
  demo:
    desc: Run the full narrated demonstration (Parts 6-11), pausing between parts
    cmds:
      - task: demo:nonexportable
      - task: _pause
        vars:
          NEXT: 'Part 7 — log in to Vault with the TPM-held key'
          RESUME: demo:login
      - task: demo:login
      - task: _pause
        vars:
          NEXT: 'Part 7.3 — least privilege: the read succeeds, the write is denied'
          RESUME: demo:privilege
      - task: demo:privilege
      - task: _pause
        vars:
          NEXT: 'Part 8 — the five negative tests'
          RESUME: demo:negative
      - task: demo:negative
      - task: _pause
        vars:
          NEXT: 'Part 9 — Vault Agent: the same login, unattended'
          RESUME: demo:agent
      - task: demo:agent
      - task: _pause
        vars:
          NEXT: 'Part 10 — a localhost Vault proxy: the workload holds no token'
          RESUME: demo:proxy
      - task: demo:proxy
      - task: _pause
        vars:
          NEXT: 'Part 11 — one agent per application, on owner-only sockets'
          RESUME: demo:multi-app
      - task: demo:multi-app

  demo:login:
    desc: 'Part 7: authenticate to Vault using the TPM-held key'
    cmds:
      - task: _run
        vars: {SCRIPT: 50_login.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:privilege:
    desc: 'Part 7.3: device token can read its secret but not write it'
    cmds:
      - task: _run
        vars: {SCRIPT: 60_privilege.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:nonexportable:
    desc: Show the key files on disk are TPM-sealed handles, not private keys
    cmds:
      - task: _run
        vars: {SCRIPT: 45_nonexportable.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:negative:
    desc: 'Part 8: every negative test, in order, pausing between them'
    cmds:
      - task: demo:negative:stolen-key
      - task: _pause
        vars:
          NEXT: '8.2 — an unregistered TPM is refused at attestation'
          RESUME: demo:negative:unenrolled-tpm
      - task: demo:negative:unenrolled-tpm
      - task: _pause
        vars:
          NEXT: '8.3 — a genuinely attested certificate from another CA is rejected'
          RESUME: demo:negative:untrusted-ca
      - task: demo:negative:untrusted-ca
      - task: _pause
        vars:
          NEXT: '8.4 — a trusted-CA certificate bound to a different TPM and role is rejected'
          RESUME: demo:negative:wrong-role
      - task: demo:negative:wrong-role
      - task: _pause
        vars:
          NEXT: '8.5 — a revoked token can no longer read'
          RESUME: demo:negative:revoked-token
      - task: demo:negative:revoked-token

  demo:negative:stolen-key:
    desc: '8.1: the key blobs are useless against a different TPM'
    cmds:
      - task: _run
        vars: {SCRIPT: 70_negative_stolen_key.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:negative:unenrolled-tpm:
    desc: '8.2: a TPM Vault has not registered is refused at attestation'
    cmds:
      - task: _run
        vars: {SCRIPT: 71_negative_unenrolled_tpm.sh, ARGS: '{{.DEVICE_NAME}} {{.DOMAIN}}'}

  demo:negative:untrusted-ca:
    desc: '8.3: a genuinely attested cert from another CA is rejected'
    cmds:
      - task: _run
        vars: {SCRIPT: 72_negative_untrusted_ca.sh, ARGS: '{{.DEVICE_NAME}} {{.DOMAIN}}'}

  demo:negative:wrong-role:
    desc: '8.4: a trusted-CA cert bound to a different TPM and role is rejected'
    cmds:
      - task: _run
        vars: {SCRIPT: 73_negative_wrong_role.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:negative:revoked-token:
    desc: '8.5: a revoked device token can no longer read'
    cmds:
      - task: _run
        vars: {SCRIPT: 74_negative_revoked_token.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:agent:
    desc: 'Part 9: Vault Agent attests and authenticates unattended'
    cmds:
      - task: _run
        vars: {SCRIPT: 80_agent.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:proxy:
    desc: 'Part 10: a workload reads through a localhost Vault Agent proxy, holding no token'
    cmds:
      - task: _run
        vars: {SCRIPT: 81_proxy.sh, ARGS: '{{.DEVICE_NAME}}'}

  demo:multi-app:
    desc: 'Part 11: per-application agents on owner-only sockets, and the boundary between them'
    cmds:
      - task: _run
        vars: {SCRIPT: 82_app_proxies.sh, ARGS: '{{.DEVICE_NAME}}'}

  # ==========================================================================
  # Maintenance
  # ==========================================================================
  reset:
    desc: Wipe lab state inside the VM but keep the VM itself
    cmds:
      - task: _run
        vars: {SCRIPT: 90_reset.sh}
      - echo "Lab state cleared. Rebuild with- task tpm vault config enrol"

  agent:soak:
    desc: 'Run the agent past its token''s max TTL and report whether it re-authenticates (~6m)'
    cmds:
      # Not part of 'task demo'. It lowers the devices role to 1m/3m tokens for
      # the duration and restores them from a trap, so the agent reaches the
      # re-authentication in minutes instead of the usual hour.
      - task: _run
        vars:
          SCRIPT: 85_agent_soak.sh
          # multipass exec does not carry the host's environment into the
          # guest, so the length is an argument: task agent:soak SOAK_MINUTES=10
          ARGS: '{{.DEVICE_NAME}} {{.SOAK_MINUTES | default "6"}}'

  tpm:flush:
    desc: Flush leaked TPM transient objects and sessions on both software TPMs
    # silent: the command body is a dozen lines of shell and the useful output
    # is the two slot counts it prints.
    silent: true
    cmds:
      # A raw swtpm socket has no resource manager, so a client killed mid-call
      # can leave a loaded key resident until something flushes it. swtpm has
      # three slots. Vault 2.2.0 frees its own handles; this is for recovering
      # from an interrupted run, and for checking the slot count.
      - |
        multipass exec {{.NAME}} -- sudo -u ubuntu bash -lc '
          source ~/lab/env.sh
          for sock in "${TPM_DEVICE_PATH}" "${ATTACKER_TPM_DEVICE_PATH}"; do
            [ -S "${sock}" ] || continue
            name=$(basename "$(dirname "${sock}")")
            export TPM2TOOLS_TCTI="swtpm:path=${sock}"
            tpm2_flushcontext -t >/dev/null 2>&1 || true
            tpm2_flushcontext -l >/dev/null 2>&1 || true
            avail=$(tpm2_getcap properties-variable 2>/dev/null \
              | grep -i HR_TRANSIENT_AVAIL | tr -d " " | cut -d: -f2)
            printf "  %-9s %s of 0x3 transient slots free\n" "${name}" "${avail:-?}"
          done'

  lint:
    desc: Run pre-commit hooks (shellcheck, gitleaks) on all files
    cmd: pre-commit run --all-files

  docs:diagram:
    desc: Render the architecture diagrams (Graphviz .dot and hand-drawn .svg) to PNG
    cmds:
      - |
        if ! command -v dot >/dev/null 2>&1; then
          echo "graphviz not found. Install it with: brew install graphviz" >&2
          exit 1
        fi
      - for: [topology, enrolment, agent]
        cmd: dot -Tpng -Gdpi=144 -o docs/diagrams/{{.ITEM}}.png docs/diagrams/{{.ITEM}}.dot
      - |
        if ! command -v rsvg-convert >/dev/null 2>&1; then
          echo "rsvg-convert not found. Install it with: brew install librsvg" >&2
          exit 1
        fi
      - for: [tpm-auth-overview, single-app-walkthrough, proxy-boundary]
        cmd: rsvg-convert --zoom 1.5 -o docs/diagrams/{{.ITEM}}.png docs/diagrams/{{.ITEM}}.svg
      - echo "Rendered docs/diagrams/topology, enrolment, agent, tpm-auth-overview, single-app-walkthrough and proxy-boundary .png"
    sources:
      - docs/diagrams/*.dot
      - docs/diagrams/*.svg
    generates:
      - docs/diagrams/*.png

  # ==========================================================================
  # Internal: sync scripts into the VM and run one
  # ==========================================================================
  # All scripts are transferred every time, not just the one being run: the
  # Part 8 negative demos invoke 50_login.sh directly, so the whole set has to
  # be present. Transfers are local and cheap, and this keeps the VM copy from
  # drifting behind the working tree mid-demo.
  _sync:
    internal: true
    cmds:
      - multipass exec {{.NAME}} -- mkdir -p {{.VM_STAGE}}
      - multipass transfer ./scripts/lib/common.sh {{.NAME}}:{{.VM_STAGE}}/common.sh
      - multipass transfer ./scripts/*.sh {{.NAME}}:{{.VM_STAGE}}/

  # Pause between demo parts so the operator can narrate. Host-side on purpose:
  # the prompt needs a terminal, and the Mac's is the only one reliably in the
  # path — see the comment at the top of scripts/host/pause.sh.
  #
  # PAUSE=1 is the default for the demo; PAUSE=0 restores the uninterrupted
  # run. Declaring it under env: means both `PAUSE=0 task demo` and
  # `task demo PAUSE=0` work, and .env can set it for good.
  _pause:
    internal: true
    interactive: true
    run: always
    requires:
      vars: [NEXT]
    env:
      PAUSE: '{{.PAUSE | default "1"}}'
    cmds:
      - ./scripts/host/pause.sh '{{.NEXT}}' '{{.RESUME}}'

  _run:
    internal: true
    requires:
      vars: [SCRIPT]
    cmds:
      - task: _sync
      - multipass exec {{.NAME}} -- sudo -E bash {{.VM_STAGE}}/{{.SCRIPT}} {{.ARGS}}
